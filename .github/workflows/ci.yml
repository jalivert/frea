name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Cabal
        uses: haskell/actions/setup@v2
        with:
          cabal-version: '3.12'

      - name: Cache Cabal packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/packages
            ~/.cabal/store
            ~/.cabal/bin
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('frea.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Install Alex and Happy
        # The lexer (Lexer.x) and grammar (Parser.y) need preprocessing.
        # Overwrite is needed because the cache above restores ~/.cabal/bin,
        # so the binaries may already exist from a previous run.
        run: |
          cabal update
          cabal install --overwrite-policy=always alex happy
          echo "$HOME/.cabal/bin" >> "$GITHUB_PATH"

      - name: Build
        run: cabal build all

      - name: Run tests
        run: cabal test all